<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#160e0a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Over Coffee" />
  <meta name="description" content="Crumple it. Toss it. Coffee holds it." />
  <title>Over Coffee</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,420;0,9..144,560;1,9..144,420&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="app.css" />
</head>
<body>
  <div id="app">
    <canvas id="scene"></canvas>
    <p class="mark" id="mark">Over Coffee</p>
    <p class="whisper" id="whisper"></p>
    <div class="line" id="line">
      <input id="thought" type="text" maxlength="120" placeholder="name it once" autocomplete="off" enterkeyhint="done" />
    </div>
    <div class="settings" id="settings">
      <p>Coffee time</p>
      <input id="wake" type="time" />
      <button id="saveSet">Alright</button>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
