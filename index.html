<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#160e0a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Over Coffee" />
  <title>Over Coffee</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,420;0,9..144,560;1,9..144,420&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="app.css?v=9" />
</head>
<body>
  <div id="app">
    <canvas id="scene"></canvas>
    <p class="mark" id="mark">Over Coffee</p>
    <div class="kit" id="kit">
      <button class="tool on" data-tool="pencil" type="button" title="Pencil">pencil</button>
      <button class="tool" data-tool="pen" type="button" title="Pen">pen</button>
      <button class="tool" data-tool="crayon" type="button" title="Crayon">crayon</button>
      <button class="tool" data-tool="marker" type="button" title="Marker">marker</button>
    </div>
    <button class="wrap hide" id="wrap" type="button">wrap</button>
    <div class="settings" id="settings">
      <p>Sound</p>
      <div class="picks">
        <button id="soundOff" type="button">Off</button>
        <button id="soundOn" type="button">On</button>
      </div>
      <button class="ok" id="saveSet" type="button">Alright</button>
    </div>
  </div>
  <script src="app.js?v=9"></script>
</body>
</html>
